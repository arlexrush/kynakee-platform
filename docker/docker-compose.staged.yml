services:
  traefik:
    image: traefik:v3
    container_name: kynakee-traefik-staged
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=kynakee-staged
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-staged-letsencrypt:/letsencrypt
    networks:
      - kynakee-staged

  kynakee-gateway:
    build:
      context: ..
      dockerfile: src/Kynakee.Gateway/Dockerfile
    container_name: kynakee-gateway-staged
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      Authentication__SigningKey: ${AUTHENTICATION_SIGNING_KEY:?AUTHENTICATION_SIGNING_KEY must be set}
      Authentication__Issuer: ${AUTHENTICATION_ISSUER:-Kynakee}
      Authentication__Audience: ${AUTHENTICATION_AUDIENCE:-KynakeeClients}
      ConnectionStrings__Redis: redis:6379
      RateLimiting__PermitLimit: ${GATEWAY_RATE_LIMIT_PERMIT_LIMIT:-100}
      RateLimiting__WindowSeconds: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:-60}
      ReverseProxy__Clusters__api__Destinations__api__Address: http://kynakee-api:8080/
    expose:
      - "8080"
    depends_on:
      kynakee-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=kynakee-staged
      - traefik.http.routers.gateway.rule=Host(`${API_HOST}`)
      - traefik.http.routers.gateway.entrypoints=websecure
      - traefik.http.routers.gateway.tls=true
      - traefik.http.routers.gateway.tls.certresolver=letsencrypt
      - traefik.http.services.gateway.loadbalancer.server.port=8080
    networks:
      - kynakee-staged

  kynakee-api:
    build:
      context: ..
      dockerfile: src/Kynakee.Api/Dockerfile
    container_name: kynakee-api-staged
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      Authentication__SigningKey: ${AUTHENTICATION_SIGNING_KEY:?AUTHENTICATION_SIGNING_KEY must be set}
      Authentication__Issuer: ${AUTHENTICATION_ISSUER:-Kynakee}
      Authentication__Audience: ${AUTHENTICATION_AUDIENCE:-KynakeeClients}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Identity__Idempotency__HashKey: ${IDENTITY_IDEMPOTENCY_HASH_KEY:?IDENTITY_IDEMPOTENCY_HASH_KEY must be set}
      Identity__Idempotency__ActiveOutcomeKeyId: v1
      Identity__Idempotency__OutcomeKeys__v1: ${IDENTITY_IDEMPOTENCY_OUTCOME_KEY_V1:?IDENTITY_IDEMPOTENCY_OUTCOME_KEY_V1 must be set}
      Identity__InvitationEmail__ActiveKeyId: v1
      Identity__InvitationEmail__Keys__v1: ${IDENTITY_INVITATION_EMAIL_KEY_V1:?IDENTITY_INVITATION_EMAIL_KEY_V1 must be set}
      Authentication__InvitationBaseUrl: ${INVITATION_BASE_URL:?INVITATION_BASE_URL must be set}
      Authentication__EmailVerificationBaseUrl: ${EMAIL_VERIFICATION_BASE_URL:?EMAIL_VERIFICATION_BASE_URL must be set}
      Authentication__PasswordResetBaseUrl: ${PASSWORD_RESET_BASE_URL:?PASSWORD_RESET_BASE_URL must be set}
      Smtp__Host: ${SMTP_HOST:-smtp-mail.outlook.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__From: ${SMTP_OAUTH_USERNAME:?SMTP_OAUTH_USERNAME must be set}
      Smtp__OAuth__ClientId: ${SMTP_OAUTH_CLIENT_ID:?SMTP_OAUTH_CLIENT_ID must be set}
      Smtp__OAuth__TenantId: ${SMTP_OAUTH_TENANT_ID:-consumers}
      Smtp__OAuth__Username: ${SMTP_OAUTH_USERNAME:?SMTP_OAUTH_USERNAME must be set}
      Smtp__OAuth__CacheKey: ${SMTP_OAUTH_CACHE_KEY:?SMTP_OAUTH_CACHE_KEY must be set}
      Smtp__OAuth__CachePath: /var/lib/kynakee/mail-oauth/mail.cache
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      Qdrant__Endpoint: http://qdrant:6333
      ObjectStorage__Enabled: "false"
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ${SMTP_OAUTH_CACHE_DIRECTORY:?SMTP_OAUTH_CACHE_DIRECTORY must be set}
        target: /var/lib/kynakee/mail-oauth
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - kynakee-staged

  postgres:
    image: postgres:17
    container_name: kynakee-postgres-staged
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-staged-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kynakee-staged

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kynakee-qdrant-staged
    restart: unless-stopped
    volumes:
      - qdrant-staged-data:/qdrant/storage
    networks:
      - kynakee-staged

  redis:
    image: redis:7-alpine
    container_name: kynakee-redis-staged
    restart: unless-stopped
    volumes:
      - redis-staged-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kynakee-staged

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: kynakee-rabbitmq-staged
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-staged-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - kynakee-staged

volumes:
  traefik-staged-letsencrypt:
  postgres-staged-data:
  qdrant-staged-data:
  redis-staged-data:
  rabbitmq-staged-data:

networks:
  kynakee-staged:
    name: kynakee-staged
