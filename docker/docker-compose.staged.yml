services:
  traefik:
    image: traefik:v3
    container_name: kynakee-traefik-staged
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=kynakee-staged
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-staged-letsencrypt:/letsencrypt
    networks:
      - kynakee-staged

  kynakee-gateway:
    build:
      context: ..
      dockerfile: src/Kynakee.Gateway/Dockerfile
    container_name: kynakee-gateway-staged
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__api__Destinations__api__Address: http://kynakee-api:8080/
    expose:
      - "8080"
    depends_on:
      kynakee-api:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=kynakee-staged
      - traefik.http.routers.gateway.rule=Host(`${API_HOST}`)
      - traefik.http.routers.gateway.entrypoints=websecure
      - traefik.http.routers.gateway.tls=true
      - traefik.http.routers.gateway.tls.certresolver=letsencrypt
      - traefik.http.services.gateway.loadbalancer.server.port=8080
    networks:
      - kynakee-staged

  kynakee-api:
    build:
      context: ..
      dockerfile: src/Kynakee.Api/Dockerfile
    container_name: kynakee-api-staged
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      Qdrant__Endpoint: http://qdrant:6333
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - kynakee-staged

  postgres:
    image: postgres:17
    container_name: kynakee-postgres-staged
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-staged-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kynakee-staged

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kynakee-qdrant-staged
    restart: unless-stopped
    volumes:
      - qdrant-staged-data:/qdrant/storage
    networks:
      - kynakee-staged

  redis:
    image: redis:7-alpine
    container_name: kynakee-redis-staged
    restart: unless-stopped
    volumes:
      - redis-staged-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kynakee-staged

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: kynakee-rabbitmq-staged
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-staged-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - kynakee-staged

volumes:
  traefik-staged-letsencrypt:
  postgres-staged-data:
  qdrant-staged-data:
  redis-staged-data:
  rabbitmq-staged-data:

networks:
  kynakee-staged:
    name: kynakee-staged
