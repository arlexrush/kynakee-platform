services:
  postgres:
    image: postgres:17
    container_name: kynakee-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kynakee-dev

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kynakee-qdrant-dev
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"
    volumes:
      - qdrant-dev-data:/qdrant/storage
    networks:
      - kynakee-dev

  redis:
    image: redis:7-alpine
    container_name: kynakee-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kynakee-dev

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: kynakee-rabbitmq-dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-dev-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kynakee-dev

  seaweedfs:
    image: chrislusf/seaweedfs:3.85
    container_name: kynakee-seaweedfs-dev
    restart: unless-stopped
    command: server -ip=127.0.0.1 -ip.bind=0.0.0.0 -dir=/data -master.volumeSizeLimitMB=32 -master.volumePreallocate=false -volume.max=0 -filer -s3 -s3.config=/etc/seaweedfs/s3.dev.json
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-dev-data:/data
      - ./seaweedfs/s3.dev.json:/etc/seaweedfs/s3.dev.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/1.1 403'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - kynakee-dev

  seaweedfs-init:
    image: amazon/aws-cli:2.27.49
    container_name: kynakee-seaweedfs-init-dev
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: synthetic-access
      AWS_SECRET_ACCESS_KEY: synthetic-secret
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-kynakee-media-dev}
    volumes:
      - ./seaweedfs/init-s3.sh:/init/init-s3.sh:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/init-s3.sh"]
    networks:
      - kynakee-dev

  kynakee-api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: kynakee-api-dev
    working_dir: /workspace
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:${API_HTTP_PORT}
      Authentication__SigningKey: ${AUTHENTICATION_SIGNING_KEY:?AUTHENTICATION_SIGNING_KEY must be set}
      Authentication__Issuer: ${AUTHENTICATION_ISSUER:-Kynakee}
      Authentication__Audience: ${AUTHENTICATION_AUDIENCE:-KynakeeClients}
      Identity__Idempotency__HashKey: ${IDENTITY_IDEMPOTENCY_HASH_KEY:?IDENTITY_IDEMPOTENCY_HASH_KEY must be set}
      Identity__Idempotency__ActiveOutcomeKeyId: v1
      Identity__Idempotency__OutcomeKeys__v1: ${IDENTITY_IDEMPOTENCY_OUTCOME_KEY_V1:?IDENTITY_IDEMPOTENCY_OUTCOME_KEY_V1 must be set}
      Identity__InvitationEmail__ActiveKeyId: v1
      Identity__InvitationEmail__Keys__v1: ${IDENTITY_INVITATION_EMAIL_KEY_V1:?IDENTITY_INVITATION_EMAIL_KEY_V1 must be set}
      Authentication__InvitationBaseUrl: ${INVITATION_BASE_URL:?INVITATION_BASE_URL must be set}
      Authentication__EmailVerificationBaseUrl: ${EMAIL_VERIFICATION_BASE_URL:?EMAIL_VERIFICATION_BASE_URL must be set}
      Smtp__Host: ${SMTP_HOST:-smtp-mail.outlook.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__From: ${SMTP_OAUTH_USERNAME:?SMTP_OAUTH_USERNAME must be set}
      Smtp__OAuth__ClientId: ${SMTP_OAUTH_CLIENT_ID:?SMTP_OAUTH_CLIENT_ID must be set}
      Smtp__OAuth__TenantId: ${SMTP_OAUTH_TENANT_ID:-consumers}
      Smtp__OAuth__Username: ${SMTP_OAUTH_USERNAME:?SMTP_OAUTH_USERNAME must be set}
      Smtp__OAuth__CacheKey: ${SMTP_OAUTH_CACHE_KEY:?SMTP_OAUTH_CACHE_KEY must be set}
      Smtp__OAuth__CachePath: /var/lib/kynakee/mail-oauth/mail.cache
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      Qdrant__Endpoint: http://qdrant:6333
      ObjectStorage__Enabled: "true"
      ObjectStorage__Endpoint: http://seaweedfs:8333
      ObjectStorage__AccessKey: synthetic-access
      ObjectStorage__SecretKey: synthetic-secret
      ObjectStorage__Bucket: ${OBJECT_STORAGE_BUCKET:-kynakee-media-dev}
      ObjectStorage__Region: us-east-1
      ObjectStorage__UseSsl: "false"
      ObjectStorage__MaxObjectBytes: ${OBJECT_STORAGE_MAX_OBJECT_BYTES:-104857600}
    expose:
      - "${API_HTTP_PORT}"
    volumes:
      - ..:/workspace
      - dotnet-dev-nuget:/root/.nuget/packages
      - type: bind
        source: ${SMTP_OAUTH_CACHE_DIRECTORY:?SMTP_OAUTH_CACHE_DIRECTORY must be set}
        target: /var/lib/kynakee/mail-oauth
        bind:
          create_host_path: false
    command: dotnet watch --project src/Kynakee.Api/Kynakee.Api.csproj run --no-launch-profile --urls http://0.0.0.0:${API_HTTP_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
    networks:
      - kynakee-dev

  kynakee-gateway:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: kynakee-gateway-dev
    working_dir: /workspace
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:${GATEWAY_HTTP_PORT}
      Authentication__SigningKey: ${AUTHENTICATION_SIGNING_KEY:?AUTHENTICATION_SIGNING_KEY must be set}
      Authentication__Issuer: ${AUTHENTICATION_ISSUER:-Kynakee}
      Authentication__Audience: ${AUTHENTICATION_AUDIENCE:-KynakeeClients}
      ConnectionStrings__Redis: redis:6379
      RateLimiting__PermitLimit: ${GATEWAY_RATE_LIMIT_PERMIT_LIMIT:-100}
      RateLimiting__WindowSeconds: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:-60}
      ReverseProxy__Clusters__api-cluster__Destinations__api__Address: http://kynakee-api:${API_HTTP_PORT}/
    ports:
      - "${GATEWAY_HOST_PORT}:${GATEWAY_HTTP_PORT}"
    volumes:
      - ..:/workspace
      - dotnet-dev-nuget:/root/.nuget/packages
    command: dotnet watch --project src/Kynakee.Gateway/Kynakee.Gateway.csproj run --no-launch-profile --urls http://0.0.0.0:${GATEWAY_HTTP_PORT}
    depends_on:
      kynakee-api:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:${GATEWAY_HTTP_PORT}/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - kynakee-dev

  ngrok:
    image: ngrok/ngrok:latest
    container_name: kynakee-ngrok-dev
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http --inspect=false --log=stdout kynakee-gateway:${GATEWAY_HTTP_PORT}
    ports:
      - "${NGROK_INSPECTOR_PORT}:4040"
    depends_on:
      kynakee-gateway:
        condition: service_started
    networks:
      - kynakee-dev

volumes:
  postgres-dev-data:
  seaweedfs-dev-data:
  qdrant-dev-data:
  redis-dev-data:
  rabbitmq-dev-data:
  dotnet-dev-nuget:

networks:
  kynakee-dev:
    name: kynakee-dev
